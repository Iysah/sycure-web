# Netlify Configuration File
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

# Global Build Settings
[build]
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"

  # Default build command
  command = "pnpm run build"

# Context-specific configuration
[context.production]
  environment = { NODE_ENV = "production", VITE_API_URL = "https://sycure-be-ldjx.onrender.com/v1" }

[context.deploy-preview]
  environment = { NODE_ENV = "development", VITE_API_URL = "https://sycure-be-ldjx.onrender.com/v1" }

[context.branch-deploy]
  environment = { NODE_ENV = "development", VITE_API_URL = "https://sycure-be-ldjx.onrender.com/v1" }

# Redirects for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content Security Policy (CSP) - Adjust as needed for external scripts/styles/apis
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;"

# Caching for static assets (Vite generates hashed filenames in assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache manifest files for a shorter duration
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"